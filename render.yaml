# Render Blueprint for pbisim-app.
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets are NOT stored here. `sync: false` means "I will set this value in the
# Render dashboard" — Render keeps it out of the repo. Render exposes service
# environment variables to the Docker build as build ARGs, so PBISIM_TOKEN /
# PBISIM_REF reach the Dockerfile's `ARG` lines.
#
# autoDeploy is ON: Render redeploys on every push to main, independently of the
# GitHub Actions test-and-deploy workflow (which is a test gate + a redundant deploy
# hook, not the primary trigger). Set autoDeploy: false if you'd rather deploy only
# when CI passes.

services:
  - type: web
    name: pbisim-app
    runtime: docker
    plan: standard           # 2GB RAM / 1 dedicated CPU, no spin-down (upgraded 2026-07-24;
                             # free 512MB was OOM-unusable). Declared here so a Blueprint sync
                             # can't silently revert the dashboard upgrade back to free.
    dockerfilePath: ./Dockerfile
    autoDeploy: true         # redeploy on every push to main (no CI/deploy-hook needed)
    healthCheckPath: /_stcore/health
    envVars:
      # Engine / pbisim-fit versions are NOT set here: they are pinned to commit SHAs
      # in deploy/pbisim.ref and deploy/pbisim-fit.ref (see the Dockerfile). A leftover
      # PBISIM_REF / PBISIM_FIT_REF env var in the dashboard is ignored — delete it.
      # fine-grained READ-ONLY GitHub PAT scoped to the pbisim repo — set in dashboard
      - key: PBISIM_TOKEN
        sync: false
      # READ-ONLY PAT for the pbisim-fit repo. OMIT if PBISIM_TOKEN already has read
      # access to pbisim-fit (the build falls back to it); set only if you use a
      # separate per-repo token.
      - key: PBISIM_FIT_TOKEN
        sync: false
      # Optional. If set, ALL visitors use this key (cost/abuse risk — see DEPLOY.md).
      # Omit it to force each user to enter their own key in the sidebar.
      - key: ANTHROPIC_API_KEY
        sync: false
